<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayatımın Anlamları</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .hero {
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 2rem;
        }

        .hero:hover {
            transform: scale(1.02);
        }

        .title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #888;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2rem;
            animation: fadeIn 1s ease 0.5s both;
        }

        .cta {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #666;
            font-weight: 400;
            animation: pulse 2s infinite 1.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* Gallery Modal */
        .gallery-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(5px);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .gallery-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-container {
            position: relative;
            width: 90%;
            max-width: 900px;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .gallery-counter {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 1px;
        }

        .gallery-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 2.5rem;
            color: #888;
            cursor: pointer;
            transition: color 0.2s;
            border: none;
            background: none;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-close:hover {
            color: #fff;
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            color: #888;
            cursor: pointer;
            transition: color 0.2s;
            border: none;
            background: none;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-nav:hover {
            color: #fff;
        }

        .gallery-nav.prev {
            left: 2rem;
        }

        .gallery-nav.next {
            right: 2rem;
        }

        @media (max-width: 768px) {
            .gallery-container {
                height: 70vh;
            }

            .gallery-nav {
                font-size: 1.5rem;
            }

            .gallery-close {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero" id="hero">
        <h1 class="title">Hayatımın Anlamları</h1>
        <div style="font-size: 3rem; margin: 1.5rem 0;">❤️</div>
        <p class="cta">Tıkla</p>
    </div>

    <div class="gallery-modal" id="galleryModal">
        <button class="gallery-close" id="closeGallery">✕</button>
        <button class="gallery-nav prev" id="prevImage">❮</button>
        <div class="gallery-container">
            <img class="gallery-image" id="galleryImage" src="" alt="Gallery Image">
        </div>
        <button class="gallery-nav next" id="nextImage">❯</button>
        <div class="gallery-counter">
            <span id="imageCounter">1</span> / <span id="totalImages">1</span>
        </div>
    </div>

    <script>
        const images = [
            'DSC05606.JPG'
        ];

        let currentImageIndex = 0;

        const hero = document.getElementById('hero');
        const galleryModal = document.getElementById('galleryModal');
        const galleryImage = document.getElementById('galleryImage');
        const closeGallery = document.getElementById('closeGallery');
        const prevImage = document.getElementById('prevImage');
        const nextImage = document.getElementById('nextImage');
        const imageCounter = document.getElementById('imageCounter');
        const totalImages = document.getElementById('totalImages');

        totalImages.textContent = images.length;

        function openGallery() {
            galleryModal.classList.add('active');
            loadImage(0);
            document.body.style.overflow = 'hidden';
        }

        function closeGalleryModal() {
            galleryModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function loadImage(index) {
            currentImageIndex = (index + images.length) % images.length;
            galleryImage.src = images[currentImageIndex];
            imageCounter.textContent = currentImageIndex + 1;
        }

        hero.addEventListener('click', openGallery);
        closeGallery.addEventListener('click', closeGalleryModal);

        prevImage.addEventListener('click', (e) => {
            e.stopPropagation();
            loadImage(currentImageIndex - 1);
        });

        nextImage.addEventListener('click', (e) => {
            e.stopPropagation();
            loadImage(currentImageIndex + 1);
        });

        galleryModal.addEventListener('click', (e) => {
            if (e.target === galleryModal) {
                closeGalleryModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (galleryModal.classList.contains('active')) {
                if (e.key === 'Escape') closeGalleryModal();
                if (e.key === 'ArrowLeft') loadImage(currentImageIndex - 1);
                if (e.key === 'ArrowRight') loadImage(currentImageIndex + 1);
            }
        });
    </script>
</body>
</html>
